*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; }

body{
  margin:0;
  background:
    radial-gradient(ellipse at top left, rgba(255,255,255,0.35), transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(122,75,40,0.10), transparent 60%),
    var(--parchment);
  color:var(--ink);
  font-family:"Cormorant Garamond","EB Garamond",Georgia,serif;
  font-size:19px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
}

h1,h2,h3,h4{
  font-family:"Amiri","Cormorant Garamond",Georgia,serif;
  font-weight:700;
  color:var(--ink);
  text-wrap:balance;
  margin:0 0 .4em;
}
h1{ letter-spacing:.01em; }

a{ color:var(--turquoise-deep); }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:3px solid var(--kiremit);
  outline-offset:2px;
}

.eyebrow{
  font-family:"Inter","Noto Sans",sans-serif;
  font-size:.72rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--turquoise-deep);
  font-weight:600;
}

.u-label{ font-family:"Inter","Noto Sans",sans-serif; }

.wrap{ max-width:var(--maxw); margin:0 auto; padding:0 28px; }

img{ max-width:100%; }

/* Emniyetli varsayılan: elle çizilen küçük ikon SVG'leri boyutsuz
   bırakılırsa tarayıcı varsayılanı (300x150) devreye girip düzeni
   bozar. Daha spesifik sınıf kuralları (ör. .hero-art, .illustration-row,
   .gallery-tile) bunun üstüne yazar. */
svg{ width:1em; height:1em; vertical-align:-0.15em; }

/* ---------- kufic/tezhip bordür ayırıcı ---------- */
.motif-divider{
  height:22px;
  width:100%;
  background-repeat:repeat-x;
  background-size:44px 22px;
  opacity:.85;
}

}
.motif-divider.bronze{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='22' viewBox='0 0 44 22'><g fill='none' stroke='%237a4b28' stroke-width='1.5'><path d='M0 11 L11 0 L22 11 L11 22 Z'/><circle cx='22' cy='11' r='3' fill='%23157a8c' stroke='none'/><path d='M22 11 L33 0 L44 11 L33 22 Z'/></g></svg>");
}

/* ============ HEADER / NAV ============ */
.site-header{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(var(--ivory), var(--parchment));
  border-bottom:2px solid var(--bronze);
  box-shadow:var(--shadow-sm);
}
.nav-bar{
  display:flex; align-items:center; gap:10px;
  padding:12px 28px;
  max-width:var(--maxw); margin:0 auto;
  position:relative; flex-wrap:wrap; row-gap:8px;
}
.brand{
  display:flex; align-items:center; gap:12px;
  text-decoration:none; color:inherit;
  min-width:0;
}
.brand img{ height:52px; width:auto; display:block; flex:none; }
.brand-text{ display:flex; flex-direction:column; line-height:1.15; min-width:0; }
.brand-text .name{
  font-family:"Amiri",serif; font-weight:700; font-size:1.18rem;
  color:var(--cobalt); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.brand-text .sub{ font-family:"Inter",sans-serif; font-size:.66rem; letter-spacing:.05em; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
/* Menü artık her zaman açılır (hamburger) panel olduğundan, okul adının
   masaüstünde küçülmesine gerek kalmıyor — üst satırda ona baskı yapan
   uzun bir bağlantı listesi yok. Gerçekten dar telefon ekranlarında ise
   (aşağıdaki .brand kuralı) yine kısaltılabiliyor. */
@media (min-width:520px){
  .brand{ flex:0 0 auto; }
}

/* Gezinme bağlantıları artık her zaman açılır bir panelde: bu sayede
   ne kadar bağlantı olursa olsun, ekran genişliği ya da giriş yapılmış
   olması (ekstra "Panom"/"Çıkış" düğmeleri) üst satırı asla bozmuyor. */
.nav-links{
  display:none; flex-direction:column; align-items:stretch; gap:2px;
  position:absolute; top:100%; left:0; right:0; margin-top:8px;
  background:linear-gradient(var(--ivory), var(--parchment));
  border:1px solid var(--line); border-top:2px solid var(--bronze);
  box-shadow:var(--shadow); border-radius:3px;
  padding:8px; max-height:75vh; overflow-y:auto;
  font-family:"Inter","Noto Sans",sans-serif;
  z-index:50;
}
.nav-links.open{ display:flex; }
.nav-links a{
  text-decoration:none; color:var(--ink-soft); font-weight:500; font-size:.95rem;
  padding:12px 14px; border-radius:2px; position:relative;
}
.nav-links a:hover{ color:var(--turquoise-deep); background:rgba(21,122,140,0.08); }
.nav-links a.active{ color:var(--turquoise-deep); font-weight:700; }
.nav-links a.active::after{
  content:""; position:absolute; left:14px; right:14px; bottom:6px; height:2px; background:var(--kiremit);
}

.nav-actions{ display:flex; align-items:center; gap:10px; flex:none; margin-left:auto; }
.nav-actions .btn{ padding:9px 14px; font-size:.82rem; }
.nav-toggle{ order:-1; }
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:34px; height:34px; border-radius:50%;
  color:var(--cobalt); background:transparent; border:1.5px solid transparent;
  text-decoration:none; transition:background .15s,border-color .15s;
}
.icon-btn:hover{ background:rgba(21,122,140,0.12); border-color:var(--turquoise); }
.icon-btn svg{ width:19px; height:19px; }

.btn{
  font-family:"Inter","Noto Sans",sans-serif;
  display:inline-flex; align-items:center; gap:8px;
  border:none; cursor:pointer;
  font-weight:600; font-size:.88rem; letter-spacing:.01em;
  padding:11px 20px; border-radius:2px;
  text-decoration:none;
  transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
}
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--kiremit); color:var(--ivory); box-shadow:var(--shadow-sm); }
.btn-primary:hover{ background:var(--kiremit-deep); }
.btn-outline{ background:transparent; color:var(--cobalt); border:1.5px solid var(--cobalt); }
.btn-outline:hover{ background:rgba(31,58,99,0.08); }
.btn-teal{ background:var(--turquoise); color:var(--ivory); }
.btn-teal:hover{ background:var(--turquoise-deep); }
.btn-sm{ padding:7px 13px; font-size:.78rem; }
.btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--line); }
.btn-ghost:hover{ border-color:var(--bronze); color:var(--bronze-deep); }
.btn-danger{ background:transparent; color:var(--kiremit-deep); border:1.5px solid var(--kiremit); }
.btn-danger:hover{ background:rgba(161,68,42,0.10); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

/* ============ HERO ============ */
.hero{
  position:relative; overflow:hidden;
  background:
    linear-gradient(180deg, rgba(250,243,226,0.6), rgba(239,227,196,0.72) 55%, rgba(227,211,169,0.88) 100%),
    var(--skyline-bg) center 78% / 130% auto no-repeat,
    var(--parchment);
  padding:64px 0 0;
  border-bottom:4px double var(--bronze);
}
.hero-inner{
  max-width:var(--maxw); margin:0 auto; padding:0 28px 40px;
  display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center;
}
.hero-copy .eyebrow{ margin-bottom:14px; display:inline-block; }
.hero h1{
  font-size:clamp(2.1rem, 4.2vw, 3.4rem);
  line-height:1.08;
  color:var(--cobalt);
  text-shadow:0 1px 0 rgba(255,255,255,0.4);
}
.hero .slogan{
  font-family:"Amiri",serif; font-style:italic; color:var(--kiremit-deep);
  font-size:1.35rem; margin:6px 0 18px;
}
.hero p.lead{ max-width:56ch; color:var(--ink-soft); font-size:1.08rem; }
.hero-ctas{ display:flex; gap:14px; margin-top:24px; flex-wrap:wrap; }

.hero-art{
  position:relative; aspect-ratio:1/1; border-radius:4px;
  border:2px solid var(--bronze);
  box-shadow:var(--shadow);
  background:linear-gradient(160deg, #f6ecd3, #e5d4ab 70%);
  overflow:hidden;
}
.hero-art .hero-photo{
  position:relative; z-index:1; display:block;
  width:100%; height:100%; object-fit:cover; object-position:50% 42%;
  mix-blend-mode:multiply;
}
.hero-art::after{
  content:""; position:absolute; inset:0; border:1px solid rgba(21,122,140,.35); margin:9px; pointer-events:none; z-index:3;
}

.hero-strip{ background:var(--ivory); border-top:1px solid var(--line); padding:34px 0 42px; }
.hero-strip h2{ font-size:1.35rem; color:var(--bronze-deep); }
.strip-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:18px; }

/* ============ GENERIC SECTIONS ============ */
.section{ padding:56px 0; }
.section.alt{ background:var(--ivory); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.section-head{ max-width:70ch; margin-bottom:32px; }
.section-head h2{ font-size:clamp(1.6rem,2.6vw,2.15rem); color:var(--cobalt); }
.section-head p{ color:var(--ink-soft); }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:28px; }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }

.info-card{
  background:var(--parchment); border:1px solid var(--line);
  border-radius:var(--radius); padding:24px 22px;
  box-shadow:var(--shadow-sm);
  position:relative;
}
.info-card .ic,.ic{
  width:42px; height:42px; border-radius:50%;
  background:rgba(21,122,140,0.12); color:var(--turquoise-deep);
  display:flex; align-items:center; justify-content:center; margin-bottom:14px;
}
.info-card .ic svg,.ic svg{ width:22px; height:22px; }
.info-card h3{ font-size:1.15rem; color:var(--bronze-deep); }
.info-card p{ color:var(--ink-soft); font-size:.98rem; margin:0; }

/* ---------- Event cards ---------- */
.event-card{
  background:var(--parchment);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow-sm);
  overflow:hidden;
  display:flex; flex-direction:column;
  position:relative;
}
.event-card .seal{
  position:absolute; top:14px; right:14px;
  width:56px; height:56px; border-radius:50%;
  background:var(--kiremit); color:var(--ivory);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:"Inter",sans-serif; box-shadow:0 3px 8px rgba(0,0,0,.25);
  border:2px solid var(--ivory);
}
.event-card .seal .d{ font-size:1.1rem; font-weight:700; line-height:1; }
.event-card .seal .m{ font-size:.58rem; letter-spacing:.06em; text-transform:uppercase; }
.event-card .body{ padding:20px 20px 18px; padding-right:84px; }
.event-card .avatar{
  width:46px; height:46px; border-radius:50%; flex:none;
  background:var(--cobalt); color:var(--ivory);
  display:flex; align-items:center; justify-content:center;
  font-family:"Amiri",serif; font-weight:700; font-size:1.1rem;
}
.event-card .who{ display:flex; gap:12px; align-items:center; margin-bottom:10px; }
.event-card .who .meta .title{ font-weight:700; color:var(--bronze-deep); font-size:1.02rem; line-height:1.2; }
.event-card .who .meta .role{ font-family:"Inter",sans-serif; font-size:.74rem; color:var(--ink-soft); }
.event-card .topic{ font-family:"Amiri",serif; font-size:1.15rem; color:var(--cobalt); margin:4px 0 10px; }
.event-card .tags{ display:flex; gap:8px; flex-wrap:wrap; font-family:"Inter",sans-serif; font-size:.74rem; }
.event-card .tag{
  display:inline-flex; align-items:center; gap:5px;
  background:rgba(92,107,50,0.14); color:var(--olive-deep);
  padding:4px 9px; border-radius:20px;
}
.event-card .tag.loc{ background:rgba(21,122,140,0.12); color:var(--turquoise-deep); }
.event-card .tag svg{ width:13px; height:13px; vertical-align:-1px; }
.event-card .foot{
  margin-top:auto; border-top:1px solid var(--line); padding:12px 20px;
  font-family:"Inter",sans-serif; font-size:.78rem; color:var(--ink-soft);
  display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.35);
}
a.event-card{ text-decoration:none; color:inherit; }
.event-card.is-link{ transition:box-shadow .15s ease, transform .15s ease; cursor:pointer; }
.event-card.is-link:hover{ box-shadow:var(--shadow); transform:translateY(-2px); }
.event-card.is-link .btn-readmore{ pointer-events:none; }

/* ---------- Etkinlik detay sayfası ---------- */
.back-link{
  display:inline-block; margin-bottom:20px; font-family:"Inter",sans-serif; font-size:.86rem;
  font-weight:600; color:var(--turquoise-deep); text-decoration:none;
}
.back-link:hover{ color:var(--bronze-deep); }
.event-detail-banner{
  display:flex; gap:20px; align-items:center; background:var(--parchment);
  border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm);
  padding:26px 28px; margin-bottom:22px;
}
.avatar-lg{
  width:76px; height:76px; border-radius:50%; flex:none;
  background:var(--cobalt); color:var(--ivory);
  display:flex; align-items:center; justify-content:center;
  font-family:"Amiri",serif; font-weight:700; font-size:1.7rem;
}
.edb-info{ min-width:0; }
.edb-info h1{ font-size:clamp(1.4rem,2.6vw,1.9rem); color:var(--cobalt); margin:2px 0 6px; }
.edb-who{ font-family:"Inter",sans-serif; font-size:.9rem; color:var(--bronze-deep); font-weight:600; margin-bottom:8px; }
.edb-info .tags{ display:flex; gap:8px; flex-wrap:wrap; font-family:"Inter",sans-serif; font-size:.74rem; }
.edb-info .tag{ display:inline-flex; align-items:center; gap:5px; background:rgba(92,107,50,0.14); color:var(--olive-deep); padding:4px 9px; border-radius:20px; }
.edb-info .tag.loc{ background:rgba(21,122,140,0.12); color:var(--turquoise-deep); }
.event-detail-summary{ font-size:1.08rem; color:var(--ink-soft); font-style:italic; }
.kazanim-box{
  background:rgba(21,122,140,0.08); border:1px solid rgba(21,122,140,0.25); border-radius:3px;
  padding:14px 16px; font-size:.98rem; color:var(--ink);
}
@media (max-width:600px){
  .event-detail-banner{ flex-direction:column; align-items:flex-start; text-align:left; }
}
.pill{
  font-family:"Inter",sans-serif; font-size:.68rem; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; padding:3px 9px; border-radius:20px;
}
.pill.open{ background:rgba(92,107,50,0.18); color:var(--olive-deep); }
.pill.closed{ background:rgba(122,75,40,0.18); color:var(--bronze-deep); }
.pill.upcoming{ background:rgba(21,122,140,0.18); color:var(--turquoise-deep); }

.events-toolbar{ display:flex; gap:10px; margin-bottom:22px; }
.tab-btn{
  font-family:"Inter",sans-serif; font-size:.86rem; font-weight:600;
  padding:9px 16px; border-radius:20px; border:1.5px solid var(--bronze);
  background:transparent; color:var(--bronze-deep); cursor:pointer;
}
.tab-btn.active{ background:var(--bronze); color:var(--ivory); }

/* ---------- Gallery / News ---------- */
.news-item{
  display:grid; grid-template-columns:90px 1fr; gap:16px;
  padding:18px 0; border-bottom:1px solid var(--line);
}
.news-item:last-child{ border-bottom:none; }
.news-date{
  font-family:"Inter",sans-serif; text-align:center;
  background:var(--ivory); border:1px solid var(--line); border-radius:3px; padding:8px 4px; height:fit-content;
}
.news-date .d{ font-family:"Amiri",serif; font-size:1.3rem; font-weight:700; color:var(--kiremit-deep); line-height:1; }
.news-date .m{ font-size:.62rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); }
.news-item h3{ font-size:1.1rem; margin-bottom:4px; color:var(--bronze-deep); }
.news-item p{ margin:0; color:var(--ink-soft); font-size:.96rem; }

.gallery-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.gallery-tile{
  aspect-ratio:1; border-radius:3px; position:relative; overflow:hidden;
  border:1px solid var(--line); box-shadow:var(--shadow-sm);
  display:flex; align-items:flex-end;
}
.gallery-tile .cap{
  position:relative; z-index:2; width:100%; padding:10px 12px;
  font-family:"Inter",sans-serif; font-size:.74rem; color:var(--ivory);
  background:linear-gradient(0deg, rgba(20,14,7,.72), transparent);
}
.gallery-tile svg{ position:absolute; inset:0; width:100%; height:100%; }

/* ---------- Contact ---------- */
.contact-grid{ display:grid; grid-template-columns:1fr 1.1fr; gap:40px; }
.contact-info dl{ display:flex; flex-direction:column; gap:16px; margin:0; }
.contact-info dt{ font-family:"Inter",sans-serif; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--turquoise-deep); font-weight:700; display:flex; align-items:center; gap:6px; }
.contact-info dt svg{ width:15px; height:15px; }
.contact-info dd{ margin:2px 0 0; color:var(--ink); }
.form-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.form-field label{ font-family:"Inter",sans-serif; font-size:.8rem; font-weight:600; color:var(--ink-soft); }
input[type=text], input[type=password], input[type=email], input[type=date], input[type=time], input[type=number], textarea, select{
  font-family:"Cormorant Garamond",Georgia,serif; font-size:1rem;
  padding:11px 13px; border:1.5px solid var(--line); border-radius:2px;
  background:var(--ivory); color:var(--ink);
}
textarea{ resize:vertical; min-height:88px; font-family:"Inter",sans-serif; font-size:.92rem; }
input:focus, textarea:focus, select:focus{ border-color:var(--turquoise); }
.card-panel{
  background:var(--parchment); border:1px solid var(--line); border-radius:var(--radius);
  padding:26px; box-shadow:var(--shadow-sm);
}

/* ============ FOOTER ============ */
.site-footer{
  background:
    radial-gradient(circle at 85% 20%, rgba(255,255,255,0.06), transparent 45%),
    linear-gradient(180deg, var(--bronze-deep), #2f1d10);
  color:#e9dcc4; padding:0 0 22px; margin-top:0;
}
.footer-inner{ max-width:var(--maxw); margin:0 auto; padding:44px 28px 24px; display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:32px; }
.footer-col h4{ color:#f1e6cf; font-family:"Amiri",serif; font-size:1.05rem; margin-bottom:12px; }
.footer-col p, .footer-col a{ color:#cbb98f; font-size:.9rem; text-decoration:none; }
.footer-col ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.footer-col a:hover{ color:#f1e6cf; }
.footer-compass{ width:64px; height:64px; opacity:.8; }
.footer-bottom{
  max-width:var(--maxw); margin:0 auto; padding:16px 28px 0;
  border-top:1px solid rgba(233,220,196,0.18);
  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  font-family:"Inter",sans-serif; font-size:.78rem; color:#b6a377;
}
.footer-social{ display:flex; gap:10px; }
.footer-social .icon-btn{ color:#e9dcc4; }
.footer-social .icon-btn:hover{ background:rgba(233,220,196,0.14); border-color:rgba(233,220,196,0.4); }

/* ============ MODAL / LOGIN ============ */
.overlay{
  position:fixed; inset:0; background:rgba(30,20,10,0.55);
  display:flex; align-items:center; justify-content:center; padding:20px; z-index:100;
}
.modal{
  background:var(--ivory); border:2px solid var(--bronze); border-radius:4px;
  width:100%; max-width:420px; box-shadow:0 24px 60px rgba(0,0,0,.35);
  position:relative;
}
.modal-head{ padding:22px 26px 0; }
.modal-head h2{ font-size:1.4rem; color:var(--cobalt); }
.modal-close{
  position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
  border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:1.1rem;
}
.modal-close:hover{ background:rgba(0,0,0,0.06); }
.modal-body{ padding:18px 26px 26px; }

.modal.modal-article{ max-width:640px; max-height:86vh; display:flex; flex-direction:column; }
.modal.modal-article .modal-body{ overflow-y:auto; }
.article-tag{ display:inline-block; font-family:"Inter",sans-serif; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--cobalt); background:rgba(21,122,140,0.1); border:1px solid rgba(21,122,140,0.3); border-radius:20px; padding:3px 10px; margin-bottom:10px; }
.article-meta{ font-family:"Inter",sans-serif; font-size:.82rem; color:var(--ink-soft); margin:0 0 14px; }
.article-body p{ margin:0 0 13px; font-size:.98rem; line-height:1.65; color:var(--ink); }
.article-body p:last-child{ margin-bottom:0; }
.btn-readmore{ background:none; border:none; padding:0; margin-top:10px; color:var(--cobalt); font-family:"Inter",sans-serif; font-weight:600; font-size:.86rem; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.btn-readmore:hover{ color:var(--bronze-deep); }

/* ---------- Blog ---------- */
.blog-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:22px; }
.blog-card{ background:var(--parchment); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow-sm); padding:22px; display:flex; flex-direction:column; }
.blog-card .article-tag{ align-self:flex-start; }
.blog-card h3{ font-size:1.12rem; color:var(--bronze-deep); margin:2px 0 8px; }
.blog-card .blog-date{ font-family:"Inter",sans-serif; font-size:.78rem; color:var(--ink-soft); margin-bottom:6px; }
.blog-card p{ color:var(--ink-soft); font-size:.93rem; margin:0 0 10px; flex:1; }
@media (max-width:760px){ .blog-grid{ grid-template-columns:1fr; } }

.role-toggle{
  display:flex; background:var(--parchment); border:1px solid var(--line); border-radius:20px; padding:4px; margin-bottom:20px;
}
.role-toggle button{
  flex:1; border:none; background:transparent; padding:9px 10px; border-radius:16px; cursor:pointer;
  font-family:"Inter",sans-serif; font-weight:600; font-size:.86rem; color:var(--ink-soft);
  transition:background .15s, color .15s;
}
.role-toggle button.active{ background:var(--turquoise); color:var(--ivory); }

.field-error{ color:var(--kiremit-deep); font-size:.84rem; font-family:"Inter",sans-serif; min-height:1.2em; margin-top:4px; }
.hint{ font-family:"Inter",sans-serif; font-size:.78rem; color:var(--ink-soft); }

/* ============ APP SHELL / DASHBOARD ============ */
.app-shell{ min-height:60vh; padding:34px 0 60px; }
.app-header{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; margin-bottom:26px; }
.app-header h1{ font-size:1.7rem; color:var(--cobalt); margin:0; }
.app-header .who{ font-family:"Inter",sans-serif; font-size:.86rem; color:var(--ink-soft); }

.tabs{ display:flex; gap:6px; border-bottom:2px solid var(--bronze); margin-bottom:24px; flex-wrap:wrap; }
.tabs button{
  font-family:"Inter",sans-serif; font-weight:600; font-size:.9rem;
  padding:10px 18px; border:none; background:transparent; color:var(--ink-soft); cursor:pointer;
  border-bottom:3px solid transparent; margin-bottom:-2px;
}
.tabs button.active{ color:var(--bronze-deep); border-bottom-color:var(--kiremit); }

table.data-table{ width:100%; border-collapse:collapse; font-family:"Inter",sans-serif; font-size:.88rem; }
table.data-table th{
  text-align:left; font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft);
  padding:9px 12px; border-bottom:2px solid var(--bronze);
}
table.data-table td{ padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
table.data-table tr:hover td{ background:rgba(21,122,140,0.05); }
.table-wrap{ overflow-x:auto; border-radius:var(--radius); }
.status-dot{ display:inline-flex; align-items:center; gap:6px; font-weight:600; }
.status-dot::before{ content:""; width:8px; height:8px; border-radius:50%; }
.status-dot.on::before{ background:var(--olive); }
.status-dot.off::before{ background:var(--kiremit); }

.badge{ font-family:"Inter",sans-serif; font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.03em; }
.badge.wait{ background:rgba(122,75,40,0.18); color:var(--bronze-deep); }
.badge.done{ background:rgba(92,107,50,0.18); color:var(--olive-deep); }

.empty-note{
  font-family:"Inter",sans-serif; color:var(--ink-soft); font-size:.92rem;
  border:1.5px dashed var(--line); border-radius:var(--radius); padding:22px; text-align:center;
}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--ivory); padding:12px 20px; border-radius:4px;
  font-family:"Inter",sans-serif; font-size:.88rem; box-shadow:var(--shadow); z-index:200;
  max-width:90vw; text-align:center;
}
.toast.err{ background:var(--kiremit-deep); }

.credential-box{
  background:var(--ivory); border:2px dashed var(--bronze); border-radius:3px; padding:16px 18px;
  font-family:"Inter",sans-serif; font-size:.9rem; margin-top:14px;
}
.credential-box .row{ display:flex; justify-content:space-between; gap:10px; padding:4px 0; }
.credential-box strong{ font-family:"Inter",sans-serif; letter-spacing:.02em; }

.form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }

.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
.stat-tile{
  background:var(--parchment); border:1px solid var(--line); border-radius:var(--radius);
  padding:18px 20px; box-shadow:var(--shadow-sm);
}
.stat-tile .num{ font-family:"Amiri",serif; font-size:1.9rem; color:var(--cobalt); font-weight:700; line-height:1; }
.stat-tile .lbl{ font-family:"Inter",sans-serif; font-size:.76rem; color:var(--ink-soft); margin-top:6px; }

.disclosure-note{
  font-family:"Inter",sans-serif; font-size:.78rem; color:var(--ink-soft);
  background:rgba(21,122,140,0.08); border:1px solid rgba(21,122,140,0.25);
  padding:12px 14px; border-radius:3px; margin-top:20px; line-height:1.5;
}

[hidden]{ display:none !important; }

/* ============ RESPONSIVE ============ */
@media (max-width:960px){
  /* Dar ekranlarda hero bölümü tek sütuna geçip çok uzadığı için, arka
     plandaki Bursa silüeti "cover" ile devasa büyüyüp anlamsızlaşıyor;
     onun yerine başlığın hemen arkasında, üstte sabit kalacak şekilde
     ayrı bir boyut/konum tanımlıyoruz. */
  .hero{
    background:
      linear-gradient(180deg, rgba(250,243,226,0.65), rgba(239,227,196,0.82) 35%, rgba(227,211,169,0.94) 100%),
      var(--skyline-bg) center top / 260% auto no-repeat,
      var(--parchment);
  }
  .hero-inner{ grid-template-columns:1fr; }
  .grid-2, .grid-3, .contact-grid{ grid-template-columns:1fr; }
  .grid-4, .strip-row{ grid-template-columns:repeat(2,1fr); }
  .gallery-grid{ grid-template-columns:repeat(2,1fr); }
  .footer-inner{ grid-template-columns:1fr; }
  .stat-row{ grid-template-columns:repeat(2,1fr); }
  .form-grid{ grid-template-columns:1fr; }
}
@media (max-width:600px){
  .brand-text .sub{ display:none; }
  .event-card .seal{ width:44px; height:44px; top:12px; right:12px; }
  .event-card .seal .d{ font-size:.86rem; }
  .event-card .seal .m{ font-size:.5rem; }
  .event-card .body{ padding-right:58px; }
}

<script>
/* ============================================================
   İnsan İnsanın Gölgesinde Yetişir — Uygulama Mantığı
   Tek dosyalık SPA: hash-tabanlı yönlendirme, basit kimlik
   doğrulama (kullanıcı adı/şifre, SHA-256 özetleme) ve rol bazlı
   panolar (öğrenci / öğretmen). Ayrı bir yönetici rolü yoktur;
   öğretmen hesapları tüm düzenleme yetkilerine sahiptir.

   ÖNEMLİ - GÜVENLİK HAKKINDA DÜRÜST NOT:
   Bu sayfa bir sunucu barındırmaz; parola karşılaştırması
   istemci tarafında yapılır ve paylaşımlı veri deposu (varsa)
   yalnızca aynı kuruma kayıtlı görüntüleyicilere açıktır.
   Şifreler asla düz metin olarak saklanmaz (SHA-256 özeti
   tutulur) ve hesap/etkinlik/not/duyuru verileri yalnızca
   düzenleme yetkisi olan kişilerce yazılabilir - ama bu, adanmış
   bir sunucu + veritabanına sahip gerçek bir arka uç kadar güçlü
   değildir. Gerçek öğrenci verisiyle üretim kullanımı için okulun
   BT/yazılım ekibiyle uygun bir arka uca taşınması önerilir.
============================================================ */
(function(){
  "use strict";

  /* ---------------- Yardımcılar ---------------- */
  function $(sel, root){ return (root||document).querySelector(sel); }
  function $all(sel, root){ return Array.from((root||document).querySelectorAll(sel)); }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  async function sha256Hex(str){
    const enc = new TextEncoder().encode(String(str));
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  function randomPassword(len){
    len = len || 9;
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
    let out = "";
    const arr = new Uint32Array(len);
    crypto.getRandomValues(arr);
    for(let i=0;i<len;i++) out += chars[arr[i] % chars.length];
    return out;
  }
  function slugify(input){
    const map = {"ç":"c","Ç":"c","ğ":"g","Ğ":"g","ı":"i","İ":"i","ö":"o","Ö":"o","ş":"s","Ş":"s","ü":"u","Ü":"u"};
    let s = String(input||"").split("").map(ch=>map[ch]!==undefined?map[ch]:ch).join("");
    s = s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    s = s.replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"").replace(/\.{2,}/g,".");
    return s || "kullanici";
  }
  const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
  function fmtDate(iso){
    if(!iso) return "-";
    const d = new Date(iso+"T00:00:00");
    if(isNaN(d)) return iso;
    return d.getDate()+" "+AY[d.getMonth()]+" "+d.getFullYear();
  }
  function fmtDateShort(iso){
    if(!iso) return {d:"--",m:"---"};
    const d = new Date(iso+"T00:00:00");
    if(isNaN(d)) return {d:"--",m:"---"};
    return {d:String(d.getDate()).padStart(2,"0"), m:AY[d.getMonth()].slice(0,3)};
  }
  function fmtDateTime(iso){
    if(!iso) return "-";
    const d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.getDate()+" "+AY[d.getMonth()]+" "+d.getFullYear()+" · "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  function initials(name){
    return String(name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function nowISO(){ return new Date().toISOString(); }

  let toastTimer = null;
  function toast(msg, isErr){
    let el = $("#toast");
    if(!el){ el = document.createElement("div"); el.id="toast"; document.body.appendChild(el); }
    el.className = "toast" + (isErr ? " err" : "");
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(toastTimer);
    // Hata mesajları bazen uzun/teknik olabiliyor (ör. sunucudan gelen
    // gerçek hata metni); okuyabilmek/ekran görüntüsü alabilmek için
    // hataları normal bildirimlerden daha uzun süre ekranda tutuyoruz.
    toastTimer = setTimeout(()=>{ el.style.display = "none"; }, isErr ? 9000 : 3400);
  }

  /* ---------------- Veri deposu soyutlaması ---------------- */
  const LOCAL_KEY_PREFIX = "iigy_v1_";
  function readLocal(col){
    try{ return JSON.parse(localStorage.getItem(LOCAL_KEY_PREFIX+col) || "{}"); }
    catch(e){ return {}; }
  }
  function writeLocal(col, obj){
    try{ localStorage.setItem(LOCAL_KEY_PREFIX+col, JSON.stringify(obj)); }catch(e){}
  }

  /* Supabase modunda tablo adları ve alan (kolon) eşleşmeleri.
     Uygulama tarafı camelCase alan adlarını, Postgres'teki snake_case
     kolon adlarına çevirir. "users" koleksiyonu gerçekte "profiles"
     tablosuna karşılık gelir; giriş yapan kişinin id'si artık kullanıcı
     adı değil, Supabase'in verdiği gerçek (uuid) kimliktir - ama uygulama
     içinde bu değer yine "username" alanında taşınır, böylece geri kalan
     kodun değişmesine gerek kalmaz. */
  const SB_TABLE = {users:"profiles", events:"events", submissions:"submissions", grades:"grades", announcements:"announcements", showcase_events:"showcase_events", blog_posts:"blog_posts"};
  const SB_COLUMNS = {
    events: {title:"title", speakerName:"speaker_name", speakerTitle:"speaker_title", location:"location", date:"date", timeSlot:"time_slot", formOpensAt:"form_opens_at", formClosesAt:"form_closes_at", createdBy:"created_by", createdAt:"created_at"},
    submissions: {eventId:"event_id", username:"student_id", studentName:"student_name", attended:"attended", timeSlotChosen:"time_slot_chosen", speakerNameConfirm:"speaker_name_confirm", summaryText:"summary_text", kazanımText:"kazanim_text", submittedAt:"submitted_at"},
    grades: {eventId:"event_id", score:"score", approved:"approved", gradedBy:"graded_by", gradedAt:"graded_at"},
    announcements: {title:"title", body:"body", createdBy:"created_by", createdAt:"created_at"},
    users: {username:"username", fullName:"full_name", role:"role", active:"active", createdAt:"created_at", schoolNo:"school_no", selfRegistered:"self_registered"},
    showcase_events: {speakerName:"speaker_name", speakerTitle:"speaker_title", topic:"topic", location:"location", date:"event_date", summary:"summary", kazanim:"kazanim", article:"article", createdBy:"created_by", createdAt:"created_at"},
    blog_posts: {tag:"tag", title:"title", date:"post_date", excerpt:"excerpt", body:"body", createdBy:"created_by", createdAt:"created_at"}
  };
  function sbToDbRow(col, obj){
    const map = SB_COLUMNS[col] || {};
    const row = {};
    Object.keys(obj||{}).forEach(function(k){ if(map[k]) row[map[k]] = obj[k]; });
    return row;
  }
  function sbFromDbRow(col, row){
    const map = SB_COLUMNS[col] || {};
    const inv = {};
    Object.keys(map).forEach(function(k){ inv[map[k]] = k; });
    const obj = {};
    Object.keys(row||{}).forEach(function(k){
      if(k==="id") return;
      obj[inv[k] || k] = row[k];
    });
    return obj;
  }

  const Store = {
    mode: "local",
    db: null,
    sb: null,
    async init(){
      try{
        if(window.SUPABASE_URL && window.SUPABASE_ANON_KEY && window.supabase && typeof window.supabase.createClient === "function"){
          this.sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
          this.mode = "supabase";
          try{
            const cur = await this.sb.auth.getSession();
            if(!cur || !cur.data || !cur.data.session){ setSession(null); }
          }catch(e){}
          return;
        }
      }catch(e){ /* sessizce sonraki moda düş */ }
      try{
        if(window.claude && typeof window.claude.use === "function"){
          const db = await Promise.race([
            window.claude.use("db"),
            new Promise(res=>setTimeout(()=>res(null), 4000))
          ]);
          if(db){ this.db = db; this.mode = "db"; return; }
        }
      }catch(e){ /* sessizce yerel moda düş */ }
      this.mode = "local";
      ensureLocalDemoSeed();
    },
    async getAll(col){
      if(this.mode==="supabase"){
        try{
          const { data, error } = await this.sb.from(SB_TABLE[col]).select("*");
          if(error){ console.warn("supabase read failed", col, error); return []; }
          return (data||[]).map(r=>Object.assign({id:r.id}, sbFromDbRow(col, r)));
        }catch(e){ console.warn("supabase read failed", col, e); return []; }
      }
      if(this.mode==="db"){
        try{
          const snap = await this.db.collection(col).get();
          return snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
        }catch(e){ console.warn("db read failed", col, e); return []; }
      }
      const all = readLocal(col);
      return Object.keys(all).map(id=>Object.assign({id:id}, all[id]));
    },
    async getOne(col, id){
      if(this.mode==="supabase"){
        try{
          const { data, error } = await this.sb.from(SB_TABLE[col]).select("*").eq("id", id).maybeSingle();
          if(error || !data) return null;
          return Object.assign({id:data.id}, sbFromDbRow(col, data));
        }catch(e){ console.warn("supabase get failed", col, id, e); return null; }
      }
      if(this.mode==="db"){
        try{
          const snap = await this.db.doc(col+"/"+id).get();
          return snap.exists ? Object.assign({id:snap.id}, snap.data()) : null;
        }catch(e){ console.warn("db get failed", col, id, e); return null; }
      }
      const all = readLocal(col);
      return all[id] ? Object.assign({id:id}, all[id]) : null;
    },
    async setDoc(col, id, data){
      if(this.mode==="supabase"){
        const row = sbToDbRow(col, data);
        row.id = id;
        if(col==="grades"){
          // grades kaydı yalnızca {score,approved,gradedBy,gradedAt} taşır;
          // event_id/student_id kaydın "eventId__uid" biçimindeki id'sinden çıkarılır.
          const sep = id.indexOf("__");
          if(sep>-1){ row.event_id = id.slice(0,sep); row.student_id = id.slice(sep+2); }
        }
        const { error } = await this.sb.from(SB_TABLE[col]).upsert(row);
        if(error){ console.warn("supabase set failed", col, id, error); return {ok:false, error:error.message}; }
        return {ok:true};
      }
      if(this.mode==="db"){
        await this.db.doc(col+"/"+id).set(data);
        return {ok:true};
      }
      const all = readLocal(col); all[id] = data; writeLocal(col, all);
      return {ok:true};
    },
    async updateDoc(col, id, patch){
      if(this.mode==="supabase"){
        const row = sbToDbRow(col, patch);
        const { error } = await this.sb.from(SB_TABLE[col]).update(row).eq("id", id);
        if(error){ console.warn("supabase update failed", col, id, error); return {ok:false, error:error.message}; }
        return {ok:true};
      }
      if(this.mode==="db"){
        try{ await this.db.doc(col+"/"+id).update(patch); }
        catch(e){ await this.db.doc(col+"/"+id).set(patch); }
        return {ok:true};
      }
      const all = readLocal(col);
      all[id] = Object.assign({}, all[id]||{}, patch);
      writeLocal(col, all);
      return {ok:true};
    },
    async deleteDoc(col, id){
      if(this.mode==="supabase"){
        const { error } = await this.sb.from(SB_TABLE[col]).delete().eq("id", id);
        if(error){ console.warn("supabase delete failed", col, id, error); return {ok:false, error:error.message}; }
        return {ok:true};
      }
      if(this.mode==="db"){ await this.db.doc(col+"/"+id).delete(); return {ok:true}; }
      const all = readLocal(col); delete all[id]; writeLocal(col, all);
      return {ok:true};
    }
  };

  /* Supabase kimlik doğrulaması, uygulamanın kullanıcı adı/şifre modeliyle
     çalışabilmesi için "kullaniciadi@iigy-app.local" biçiminde sahte bir

     Supabase Auth'un e-posta biçimi zorunluluğunu karşılar. */
  function sbSyntheticEmail(username){ return username + "@iigy-app.local"; }
  /* Ana (öğretmen/öğrenci) oturumunu bozmadan tek seferlik signUp gibi
     işlemler için "geçici" bir Supabase istemcisi oluşturur. persistSession:false
     ve autoRefreshToken:false ÖNEMLİ: bunlar olmadan bu istemci, tarayıcının
     localStorage'ındaki oturum bilgisini ana istemciyle paylaşıp üzerine
     yazabiliyordu (bu, "ikinci öğrenci hesabı oluşturulamıyor" hatasının
     kök nedeniydi). */
  function sbEphemeralClient(){
    return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
  }
  /* supabase-js, bir Edge Function 2xx dışında bir HTTP kodu döndürdüğünde
     (ör. bizim fonksiyonlarımızın kullandığı 401/403/404/500), "error"
     nesnesinin .message alanına genelde faydasız, genel bir metin
     ("Edge Function returned a non-2xx status code") koyar; fonksiyonun
     kendi döndürdüğü asıl (Türkçe, anlaşılır) hata mesajı yanıtın gövdesinde
     kalır ve otomatik okunmaz. Bu yardımcı, mümkünse o gerçek gövdeyi okuyup
     kullanıcıya anlamlı bir hata gösterebilmemizi sağlıyor. */
  async function sbFunctionErrorDetail(error, data){
    if(error){
      try{
        if(error.context && typeof error.context.clone === "function"){
          const body = await error.context.clone().json().catch(()=>null);
          if(body && body.error) return body.error;
          const text = await error.context.clone().text().catch(()=>null);
          if(text) return text.slice(0,300);
        }
      }catch(e){ /* yoksay, aşağıdaki yedeklere düş */ }
      return error.message || (error.name || "bilinmeyen hata") ;
    }
    if(data && data.error) return data.error;
    if(!data) return "bilinmeyen hata (sunucudan yanıt alınamadı)";
    return "bilinmeyen hata";
  }

  const SESSION_KEY = "iigy_session_v1";
  function getSession(){
    try{ return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }catch(e){ return null; }
  }
  function setSession(s){
    if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
    else localStorage.removeItem(SESSION_KEY);
  }

  const loginAttempts = {}; // username -> {count, lockUntil}
  function isLocked(username){
    const a = loginAttempts[username];
    return a && a.lockUntil && a.lockUntil > Date.now();
  }
  function registerFail(username){
    const a = loginAttempts[username] || {count:0, lockUntil:0};
    a.count++;
    if(a.count >= 5){ a.lockUntil = Date.now() + 30000; a.count = 0; }
    loginAttempts[username] = a;
  }
  function registerSuccess(username){ delete loginAttempts[username]; }

  async function attemptLogin(role, usernameRaw, password){
    const username = slugify(usernameRaw);
    if(!username || !password) return {ok:false, msg:"Kullanıcı adı ve şifre gerekli."};
    if(isLocked(username)) return {ok:false, msg:"Çok fazla başarısız deneme. Lütfen 30 saniye sonra tekrar deneyin."};
    if(Store.mode==="supabase"){
      try{
        const { data, error } = await Store.sb.auth.signInWithPassword({ email: sbSyntheticEmail(username), password: password });
        if(error || !data || !data.user){
          registerFail(username);
          return {ok:false, msg:"Kullanıcı adı, şifre veya rol seçimi hatalı."};
        }
        const profile = await sbGetProfileByUsername(username);
        if(!profile || profile.role !== role){
          await Store.sb.auth.signOut();
          registerFail(username);
          return {ok:false, msg:"Kullanıcı adı, şifre veya rol seçimi hatalı."};
        }
        if(profile.active === false){
          await Store.sb.auth.signOut();
          return {ok:false, msg:"Bu hesap öğretmeniniz tarafından pasif hale getirilmiş."};
        }
        registerSuccess(username);
        const session = {username: profile.id, role: profile.role, fullName: profile.fullName};
        setSession(session);
        return {ok:true, session:session};
      }catch(e){
        registerFail(username);
        return {ok:false, msg:"Giriş sırasında bir sorun oluştu, lütfen tekrar deneyin."};
      }
    }
    const user = await Store.getOne("users", username);
    if(!user || user.role !== role){
      registerFail(username);
      return {ok:false, msg:"Kullanıcı adı, şifre veya rol seçimi hatalı."};
    }
    if(user.active === false){
      return {ok:false, msg:"Bu hesap öğretmeniniz tarafından pasif hale getirilmiş."};
    }
    const hash = await sha256Hex(password);
    if(hash !== user.passwordHash){
      registerFail(username);
      return {ok:false, msg:"Kullanıcı adı, şifre veya rol seçimi hatalı."};
    }
    registerSuccess(username);
    const session = {username:username, role:user.role, fullName:user.fullName};
    setSession(session);
    return {ok:true, session:session};
  }

  /* Öğrencinin kendi kendine kayıt olması (öğretmen onayı bekleyen hesap).
     Yalnızca Supabase modunda anlamlıdır - yerel/demo modda böyle bir onay
     akışı olmadığından basitçe pasif bir hesap oluşturur. Kullanıcı adı
     ad-soyaddan türetilir; e-posta zaten alınmışsa (aynı isimde başka bir
     kayıt varsa) otomatik olarak sonuna sayı eklenerek yeniden denenir. */
  async function attemptSelfRegister(fullName, schoolNo, password){
    fullName = String(fullName||"").trim();
    schoolNo = String(schoolNo||"").trim();
    if(!fullName || !schoolNo || !password) return {ok:false, msg:"Ad soyad, okul no ve şifre gerekli."};
    if(password.length < 6) return {ok:false, msg:"Şifre en az 6 karakter olmalı."};
    let username = slugify(fullName);
    if(!username) return {ok:false, msg:"Geçerli bir ad soyad girin."};
    if(Store.mode==="supabase"){
      const client = sbEphemeralClient();
      let n = 2;
      for(let attempt=0; attempt<6; attempt++){
        try{
          const { data, error } = await client.auth.signUp({
            email: sbSyntheticEmail(username),
            password: password,
            options: { data: { username: username, full_name: fullName, role: "ogrenci", school_no: schoolNo, self_registered: true } }
          });
          if(!error && data && data.user){
            try{ await client.auth.signOut(); }catch(e){}
            return {ok:true, username: username};
          }
          const msg = (error && error.message) || "";
          if(/already registered|already exists|users_email/i.test(msg)){
            username = slugify(fullName) + n; n++;
            continue;
          }
          return {ok:false, msg: msg || "Kayıt oluşturulamadı, lütfen tekrar deneyin."};
        }catch(e){
          return {ok:false, msg:"Kayıt sırasında bir sorun oluştu, lütfen tekrar deneyin."};
        }
      }
      return {ok:false, msg:"Kayıt oluşturulamadı, lütfen farklı bir ad ile tekrar deneyin."};
    }
    // Yerel/demo mod: onay akışı yok ama tutarlılık için hesabı pasif oluşturuyoruz.
    let existing = await Store.getOne("users", username);
    let n2 = 2;
    while(existing){ username = slugify(fullName)+n2; existing = await Store.getOne("users", username); n2++; }
    const hash = await sha256Hex(password);
    await Store.setDoc("users", username, {username:username, fullName:fullName, role:"ogrenci", schoolNo:schoolNo, selfRegistered:true, passwordHash:hash, active:false, createdAt:nowISO()});
    return {ok:true, username: username};
  }

  function eventDetailCard(e, isUpcoming, idForLink){
    const dt = fmtDateShort(e.date);
    const hasDetail = !isUpcoming && idForLink && e.article && e.article.length;
    const tag = hasDetail ? "a" : "div";
    const attrs = hasDetail ? ' href="#/etkinlik/'+encodeURIComponent(idForLink)+'"' : "";
    return (
      '<'+tag+' class="event-card'+(hasDetail?" is-link":"")+'"'+attrs+'>'+
        '<div class="seal"><span class="d">'+dt.d+'</span><span class="m">'+dt.m+'</span></div>'+

          '<div class="tags"><span class="tag loc">'+ICO.pin+' '+escapeHtml(e.location)+'</span><span class="tag">'+ICO.calendar+' '+fmtDate(e.date)+'</span></div>'+

        '<span class="pill '+(isUpcoming?"upcoming":"closed")+'">'+(isUpcoming?"Yaklaşan":"Tamamlandı")+'</span></div>'+
      '</'+tag+'>'
    );
  }

  async function viewStudentPanel(){
    const session = App.session;
    const [events, submissions, grades, announcements] = await Promise.all([
      Store.getAll("events"), Store.getAll("submissions"), Store.getAll("grades"), Store.getAll("announcements")
    ]);
    const mySubs = submissions.filter(s=>s.username===session.username);
    const myStats = computeStudentStats(session.username, submissions, grades);
    const now = Date.now();
    const openEvents = events.filter(e=>{
      const opens = e.formOpensAt ? new Date(e.formOpensAt).getTime() : -Infinity;
      const closes = e.formClosesAt ? new Date(e.formClosesAt).getTime() : Infinity;
      return now >= opens && now <= closes;
    });
    const pastEvents = events.filter(e=> !openEvents.includes(e)).sort((a,b)=> (b.date||"").localeCompare(a.date||""));

    let openHtml;
    if(!openEvents.length){
      openHtml = '<div class="empty-note">Şu anda değerlendirme bekleyen açık bir etkinlik yok. Yeni bir etkinlik açıldığında burada görüneceksiniz.</div>';
    } else {
      openHtml = openEvents.map(e=>{
        const already = mySubs.find(s=>s.eventId===e.id);
        if(already){
          return '<div class="card-panel"><h3 style="margin-top:0;">'+escapeHtml(e.title)+'</h3><p class="hint">Bu etkinlik için değerlendirmenizi zaten gönderdiniz. Aşağıda "Geçmiş Etkinliklerim" bölümünden görüntüleyebilirsiniz.</p></div>';
        }
        return (
          '<div class="card-panel">'+
            '<span class="pill open" style="margin-bottom:10px;display:inline-block;">Bu Hafta Açık</span>'+
            '<h3 style="margin-top:8px;">'+escapeHtml(e.title)+'</h3>'+
            '<p class="hint">'+escapeHtml(e.speakerName)+' &middot; '+escapeHtml(e.speakerTitle||"")+' &middot; '+ICO.pin+' '+escapeHtml(e.location)+' &middot; '+fmtDate(e.date)+'</p>'+
            '<form class="eval-form" data-event="'+e.id+'">'+
              (e.timeSlot==="tam-gun" ? (
                '<div class="form-field"><label>Katıldığınız Oturum</label><select name="slot" required><option value="">Seçiniz</option><option value="sabah">Sabah</option><option value="ogle">Öğlen</option></select></div>'
              ) : '<input type="hidden" name="slot" value="'+(e.timeSlot||"tam-gun")+'">')+
              '<div class="form-field"><label><input type="checkbox" name="attended" required style="width:auto;"> Etkinliğe katıldım</label></div>'+
              '<div class="form-field"><label>Konuşmayı Yapan Kişi</label><input type="text" value="'+escapeHtml(e.speakerName)+'" disabled></div>'+
              '<div class="form-field"><label>Etkinlik Özeti</label><textarea name="summary" required placeholder="Etkinlikte neler konuşuldu, kısaca özetleyin."></textarea></div>'+
              '<div class="form-field"><label>Bu Etkinlikten Edindiğim Kazanım</label><textarea name="kazanım" required placeholder="Sizin için en önemli çıkarım ne oldu?"></textarea></div>'+
              '<button class="btn btn-primary" type="submit">Gönder</button>'+
            '</form>'+
          '</div>'
        );
      }).join("");
    }

    const historyRows = pastEvents.map(e=>{
      const sub = mySubs.find(s=>s.eventId===e.id);
      const grade = grades.find(g=>g.id===(e.id+"__"+session.username));
      let statusCell;
      if(!sub) statusCell = '<span class="hint">Katılım kaydı yok</span>';
      else if(grade) statusCell = '<span class="badge done">Puan: '+grade.score+'/100</span>';
      else statusCell = '<span class="badge wait">Değerlendirme bekleniyor</span>';
      return '<tr><td>'+escapeHtml(e.title)+'</td><td>'+fmtDate(e.date)+'</td><td>'+(sub?escapeHtml(sub.summaryText).slice(0,60)+"…":"—")+'</td><td>'+statusCell+'</td></tr>';
    }).join("");

    const annHtml = announcements.length ? (
      announcements.slice().sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||"")).map(a=>(
        '<div class="card-panel" style="margin-bottom:12px;">'+
          '<h3 style="margin:0 0 4px;font-size:1.02rem;">'+escapeHtml(a.title)+'</h3>'+
          '<div class="hint" style="margin-bottom:8px;">'+fmtDateTime(a.createdAt)+'</div>'+
          '<p style="margin:0;color:var(--ink-soft);">'+escapeHtml(a.body)+'</p>'+
        '</div>'
      )).join("")
    ) : '<div class="empty-note">Şu anda bir duyuru yok.</div>';

    return (
      '<div class="app-shell"><div class="wrap">'+
        '<div class="app-header"><div><h1>Öğrenci Panom</h1><div class="who">Hoş geldin, '+escapeHtml(session.fullName)+'</div></div></div>'+
        '<div class="stat-row">'+
          '<div class="stat-tile"><div class="num">'+mySubs.length+'</div><div class="lbl">Gönderdiğim Değerlendirme</div></div>'+
          '<div class="stat-tile"><div class="num">'+myStats.gradedCount+'</div><div class="lbl">Puanlanan Etkinlik</div></div>'+
          '<div class="stat-tile"><div class="num">'+(myStats.avg!=null?myStats.avg:"—")+'</div><div class="lbl">Not Ortalamam</div></div>'+
        '</div>'+
        '<h2 style="font-size:1.2rem;color:var(--bronze-deep);">Duyurular</h2>'+
        annHtml+
        '<h2 style="font-size:1.2rem;color:var(--bronze-deep);margin-top:36px;">Bu Haftanın Etkinliği</h2>'+
        openHtml+
        '<h2 style="font-size:1.2rem;color:var(--bronze-deep);margin-top:36px;">Geçmiş Etkinliklerim <span class="hint">(salt okunur)</span></h2>'+
        (pastEvents.length ? (
          '<div class="table-wrap"><table class="data-table"><thead><tr><th>Etkinlik</th><th>Tarih</th><th>Gönderdiğim Özet</th><th>Durum</th></tr></thead><tbody>'+historyRows+'</tbody></table></div>'
        ) : '<div class="empty-note">Henüz geçmiş bir etkinlik kaydınız yok.</div>')+
        (Store.mode==="local" ? '<div class="disclosure-note">Bu tarayıcıda deneme modundasınız: verileriniz yalnızca bu cihazda saklanır ve öğretmeninizin panosunda görünmez.</div>' : '')+
      '</div></div>'
    );
  }

  async function handleEvalSubmit(form){
    const eventId = form.dataset.event;
    const session = App.session;
    const fd = new FormData(form);
    const data = {
      eventId: eventId,
      username: session.username,
      studentName: session.fullName,
      attended: !!fd.get("attended"),
      timeSlotChosen: fd.get("slot")||"",
      speakerNameConfirm: form.querySelector('input[disabled]').value,
      summaryText: String(fd.get("summary")||"").trim(),
      kazanımText: String(fd.get("kazanım")||"").trim(),
      submittedAt: nowISO()
    };
    if(!data.summaryText || !data.kazanımText){ toast("Lütfen özet ve kazanım alanlarını doldurun.", true); return; }
    const res = await Store.setDoc("submissions", eventId+"__"+session.username, data);
    if(res && res.ok===false){ toast("Gönderilemedi: "+(res.error||"bilinmeyen hata"), true); return; }

    const subs = submissions.filter(s=>s.username===username);
    const scored = subs.map(s=>{
      const g = grades.find(gr=>gr.id===(s.eventId+"__"+username));
      return g ? g.score : null;
    }).filter(v=>v!=null);
    const avg = scored.length ? Math.round(scored.reduce((a,b)=>a+b,0)/scored.length) : null;
    return {subs:subs, avg:avg, gradedCount:scored.length};
  }

  function bindLoginModalEvents(el){
    $("#loginClose", el).addEventListener("click", closeLoginModal);
    if(loginView==="login"){
      $all(".role-toggle button", el).forEach(btn=>{
        btn.addEventListener("click", function(){
          loginRole = btn.dataset.role;
          renderLoginModal(el);
        });
      });
      $("#loginForm", el).addEventListener("submit", async function(ev){
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const res = await attemptLogin(loginRole, fd.get("username"), fd.get("password"));
        if(!res.ok){ $("#loginErr", el).textContent = res.msg; return; }
        App.session = res.session;
        closeLoginModal();
        location.hash = loginRole==="ogretmen" ? "#/panel/ogretmen" : "#/panel/ogrenci";
        render();
      });
      const gr = $("#goToRegister", el);
      if(gr) gr.addEventListener("click", function(ev){ ev.preventDefault(); loginView="register"; renderLoginModal(el); });
    } else if(loginView==="register"){
      $("#registerForm", el).addEventListener("submit", async function(ev){
        ev.preventDefault();
        const fd = new FormData(ev.target);
        const pass = String(fd.get("password")||"");
        const pass2 = String(fd.get("password2")||"");
        if(pass !== pass2){ $("#registerErr", el).textContent = "Şifreler eşleşmiyor."; return; }
        const submitBtn = $("#registerForm button[type=submit]", el);
        if(submitBtn) submitBtn.disabled = true;
        const res = await attemptSelfRegister(fd.get("fullName"), fd.get("schoolNo"), pass);
        if(submitBtn) submitBtn.disabled = false;
        if(!res.ok){ $("#registerErr", el).textContent = res.msg; return; }
        lastRegisteredUsername = res.username;
        loginView = "registered";
        renderLoginModal(el);
      });
      const gl = $("#goToLogin", el);
      if(gl) gl.addEventListener("click", function(ev){ ev.preventDefault(); loginView="login"; renderLoginModal(el); });
    } else if(loginView==="registered"){
      $("#goToLoginFromRegistered", el).addEventListener("click", function(){ loginView="login"; renderLoginModal(el); });
    }
  }
  function renderLoginModal(el){
    $(".modal", el).innerHTML = '<button class="modal-close" id="loginClose" aria-label="Kapat">&times;</button>'+loginModalBodyHtml();
    bindLoginModalEvents(el);
  }
  function openLoginModal(){
    let el = $("#loginOverlay");
    if(el) return;
    el = document.createElement("div");
    el.className = "overlay";
    el.id = "loginOverlay";
    loginRole = "ogrenci";
    loginView = "login";
    el.innerHTML = '<div class="modal"></div>';
    document.body.appendChild(el);
    renderLoginModal(el);
    el.addEventListener("click", function(ev){ if(ev.target===el) closeLoginModal(); });
  }
  function closeLoginModal(){
    const el = $("#loginOverlay");
    if(el) el.remove();
  }

  /* ---------------- Yönlendirme / Olaylar ---------------- */
  async function render(){
    closeArticleModal();
    App.session = getSession();
    const path = (location.hash || "#/").split("?")[0];
    const app = $("#app");
    $("#headerSlot").innerHTML = layoutHeader();
    bindHeaderEvents();

    if(path.indexOf("#/panel/ogrenci")===0){
      if(!App.session || App.session.role!=="ogrenci"){ location.hash="#/"; openLoginModal(); return; }
      app.innerHTML = '<div class="app-shell"><div class="wrap"><p class="hint">Yükleniyor…</p></div></div>';
      app.innerHTML = await viewStudentPanel();
      bindStudentEvents();
    } else if(path.indexOf("#/panel/ogretmen")===0){
      if(!App.session || App.session.role!=="ogretmen"){ location.hash="#/"; openLoginModal(); return; }
      app.innerHTML = '<div class="app-shell"><div class="wrap"><p class="hint">Yükleniyor…</p></div></div>';
      app.innerHTML = await viewTeacherPanel();
      bindTeacherEvents();
    } else if(path.indexOf("#/proje-hakkinda")===0){
      app.innerHTML = viewAbout();
    } else if(path.indexOf("#/etkinlik/")===0){
      const id = decodeURIComponent(path.slice("#/etkinlik/".length));
      app.innerHTML = '<div class="app-shell"><div class="wrap"><p class="hint">Yükleniyor…</p></div></div>';
      app.innerHTML = await viewEventDetail(id);
    } else if(path.indexOf("#/etkinlikler")===0){
      app.innerHTML = '<div class="app-shell"><div class="wrap"><p class="hint">Yükleniyor…</p></div></div>';
      app.innerHTML = await viewEvents();
    } else if(path.indexOf("#/haberler-galeri")===0){
      app.innerHTML = viewNews();
    } else if(path.indexOf("#/blog")===0){
      app.innerHTML = '<div class="app-shell"><div class="wrap"><p class="hint">Yükleniyor…</p></div></div>';
      app.innerHTML = await viewBlog();
    } else if(path.indexOf("#/iletisim")===0){
      app.innerHTML = viewContact();
      bindContactEvents();
    } else {
      app.innerHTML = '<div class="app-shell"><div class="wrap"><p class="hint">Yükleniyor…</p></div></div>';
      app.innerHTML = await viewHome();
    }
    window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});

  function bindHeaderEvents(){
    const btn = $("#btnOpenLogin");
    if(btn) btn.addEventListener("click", openLoginModal);
    const out = $("#btnLogout");
    if(out) out.addEventListener("click", async function(){
      if(Store.mode==="supabase"){ try{ await Store.sb.auth.signOut(); }catch(e){} }
      setSession(null); App.session=null; location.hash="#/"; render();
    });
    // Dar ekranlarda/menü sığmadığında görünen açılır (hamburger) menü.
    const navToggle = $("#navToggle");
    const navLinksEl = $("#navLinks");
    if(navToggle && navLinksEl){
      navToggle.addEventListener("click", function(){
        const isOpen = navLinksEl.classList.toggle("open");
        navToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
      });
      navLinksEl.addEventListener("click", function(ev){
        if(ev.target && ev.target.tagName==="A"){
          navLinksEl.classList.remove("open");
          navToggle.setAttribute("aria-expanded", "false");
        }
      });
    }
  }

        if(Store.mode==="supabase"){
          addBtn.disabled = true;
          try{

            const tempClient = sbEphemeralClient();
            const { data, error } = await tempClient.auth.signUp({
              email: sbSyntheticEmail(username),
              password: pass,
              options: { data: { username: username, full_name: fullName, role: "ogrenci" } }
            });
            if(error || !data || !data.user){
              toast("Öğrenci oluşturulamadı: "+(error?error.message:"bilinmeyen hata"), true);

          data.createdAt = nowISO();
          const res = await Store.setDoc("blog_posts", id, data);
          if(res && res.ok===false){ toast("Yayınlanamadı: "+(res.error||"bilinmeyen hata"), true); return; }
          toast("Blog yazısı yayınlandı.");
        }
        render();
      });
    }
    $all("[data-act=editBlog]").forEach(b=>{
      b.addEventListener("click", function(){ teacherEditingBlogId = b.dataset.id; render(); });
    });
    const cancelBlogBtn = $("[data-act=cancelEditBlog]");
    if(cancelBlogBtn){
      cancelBlogBtn.addEventListener("click", function(){ teacherEditingBlogId = null; render(); });
    }
    $all("[data-act=deleteBlog]").forEach(b=>{
      b.addEventListener("click", async function(){
        if(!confirm("Bu blog yazısını silmek istediğinize emin misiniz?")) return;
        const res = await Store.deleteDoc("blog_posts", b.dataset.id);
        if(res && res.ok===false){ toast("Silinemedi: "+(res.error||"bilinmeyen hata"), true); return; }
        if(teacherEditingBlogId===b.dataset.id) teacherEditingBlogId = null;
        toast("Blog yazısı silindi.");
        render();
      });
    });
  }
  window.addEventListener("hashchange", render);
  document.addEventListener("DOMContentLoaded", async function(){
    $("#footerSlot").outerHTML = layoutFooter();
    bindReadMoreDelegate();
    await Store.init();
    render();
  });
})();

</script>
